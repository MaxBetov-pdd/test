name: Verify and build d79 artifacts

on:
  workflow_dispatch:
  push:
    branches:
      - codex/usbliter8-d79
    paths:
      - "work-27.0b4-d79/**"
      - "tools/**"
      - ".github/workflows/build-d79-sshrd.yml"

jobs:
  verify-port:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install verification dependencies
        run: python3 -m pip install pyimg4 remotezip requests

      - name: Fetch pristine d79 boot components
        working-directory: work-27.0b4-d79
        run: python3 ./get_fw.py

      - name: Verify all d79 firmware patch tables
        working-directory: work-27.0b4-d79
        run: python3 ./verify_d79_port.py

  build:
    needs: verify-port
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        run: |
          test "$(uname -m)" = arm64
          chmod +x tools/*

      - name: Install build dependencies
        run: |
          brew install gnu-tar rsync
          python3 -m venv "$RUNNER_TEMP/d79-venv"
          "$RUNNER_TEMP/d79-venv/bin/pip" install pyimg4 remotezip requests
          echo "$RUNNER_TEMP/d79-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch and selectively extract d79 firmware
        working-directory: work-27.0b4-d79
        run: python3 ./get_fw.py

      - name: Supply the device/build wrapping manifest
        working-directory: work-27.0b4-d79
        env:
          D79_IM4M_B64: ${{ secrets.D79_IM4M_B64 }}
        run: |
          test -n "$D79_IM4M_B64"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path("t8030_apticket.der").write_bytes(base64.b64decode(os.environ["D79_IM4M_B64"], validate=True))
          PY
          test -s t8030_apticket.der

      - name: Build SSH ramdisk
        working-directory: work-27.0b4-d79
        run: python3 ./get_rd.py

      - name: Verify artifact contents
        working-directory: work-27.0b4-d79
        run: |
          python3 ./apply_patches.py ibss-ramdisk Ramdisk/iBSS.raw
          for f in iBEC.img4 RestoreRamdisk.img4 DeviceTree.img4 SEP.img4 \
                   Kernelcache.img4 TXM.img4 SPTM.img4 RestoreTrustCache.img4; do
            test -s "Ramdisk/$f"
          done
          mkdir verify-ramdisk
          ../tools/img4 -i Ramdisk/RestoreRamdisk.img4 -o verify-ramdisk.dmg
          hdiutil attach -readonly -nobrowse -mountpoint verify-ramdisk verify-ramdisk.dmg
          test -x verify-ramdisk/usr/local/bin/dropbear
          test -x verify-ramdisk/usr/libexec/sftp-server
          hdiutil detach verify-ramdisk
          rm -rf verify-ramdisk verify-ramdisk.dmg

          ../tools/img4 -i Ramdisk/iBEC.img4 -o verify-ibec.raw
          python3 ./apply_patches.py ibss-ramdisk verify-ibec.raw
          ../tools/img4 -i Ramdisk/Kernelcache.img4 -o verify-kernel.raw
          python3 ./apply_patches.py kc-restore verify-kernel.raw
          ../tools/img4 -i Ramdisk/TXM.img4 -o verify-txm.raw
          python3 ./apply_patches.py txm-restore verify-txm.raw
          rm verify-ibec.raw verify-kernel.raw verify-txm.raw

          cp boot_rd.sh Ramdisk/
          cp boot_sshrd_linux.py boot_sshrd_linux.sh Ramdisk/
          cp ../tools/usbliter8ctl Ramdisk/
          cp ../tools/img4tool Ramdisk/
          python3 ./write_artifact_info.py --mode sshrd --directory Ramdisk

      - name: Upload bootchain
        uses: actions/upload-artifact@v4
        with:
          name: d79-24A5390f-sshrd
          path: work-27.0b4-d79/Ramdisk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  build-normal-experimental:
    needs: verify-port
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          chmod +x tools/*
          brew install rsync
          python3 -m venv "$RUNNER_TEMP/d79-normal-venv"
          "$RUNNER_TEMP/d79-normal-venv/bin/pip" install pyimg4 remotezip requests
          echo "$RUNNER_TEMP/d79-normal-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch and verify pristine d79 components
        working-directory: work-27.0b4-d79
        run: |
          python3 ./get_fw.py
          python3 ./verify_d79_port.py

      - name: Supply the device/build wrapping manifest
        working-directory: work-27.0b4-d79
        env:
          D79_IM4M_B64: ${{ secrets.D79_IM4M_B64 }}
        run: |
          test -n "$D79_IM4M_B64"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path("t8030_apticket.der").write_bytes(
              base64.b64decode(os.environ["D79_IM4M_B64"], validate=True)
          )
          PY
          test -s t8030_apticket.der

      - name: Build experimental normal bootchain
        working-directory: work-27.0b4-d79
        run: python3 ./get_boot.py

      - name: Verify normal boot artifact
        working-directory: work-27.0b4-d79
        run: |
          for f in iBSS.raw iBEC.img4 RestoreLogo.img4 ANE.img4 AOP.img4 AVE.img4 \
                   SPTM.img4 TXM.img4 GFX.img4 ISP.img4 PMP.img4 \
                   RestoreTrustCache.img4 SIO.img4 WCH.img4 DeviceTree.img4 \
                   SEP.img4 Kernelcache.img4; do
            test -s "Ramdisk/$f"
          done
          test ! -e Ramdisk/RestoreRamdisk.img4

          python3 ./apply_patches.py ibss-normal Ramdisk/iBSS.raw
          ../tools/img4 -i Ramdisk/iBEC.img4 -o verify-normal-ibec.raw
          python3 ./apply_patches.py ibss-normal verify-normal-ibec.raw
          ../tools/img4 -i Ramdisk/TXM.img4 -o verify-normal-txm.raw
          python3 ./apply_patches.py txm-boot verify-normal-txm.raw
          ../tools/img4 -i Ramdisk/Kernelcache.img4 -o verify-normal-kernel.raw
          python3 ./apply_patches.py kc-boot verify-normal-kernel.raw
          ../tools/img4 -i Ramdisk/DeviceTree.img4 -o verify-normal-dt.raw
          python3 - <<'PY'
          from pathlib import Path
          import patch_dt2
          data = Path("verify-normal-dt.raw").read_bytes()
          if not patch_dt2.verify(data):
              raise SystemExit("normal DeviceTree verification failed")
          PY
          rm verify-normal-ibec.raw verify-normal-txm.raw verify-normal-kernel.raw \
             verify-normal-dt.raw

          cp boot_sshrd_linux.py boot_normal_linux.py boot_normal_linux.sh Ramdisk/
          python3 ./write_artifact_info.py --mode normal-experimental --directory Ramdisk

      - name: Upload experimental normal bootchain
        uses: actions/upload-artifact@v4
        with:
          name: d79-24A5390f-normal-experimental
          path: work-27.0b4-d79/Ramdisk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  build-normal-diagnostic:
    needs: verify-port
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          chmod +x tools/*
          brew install rsync
          python3 -m venv "$RUNNER_TEMP/d79-diag-venv"
          "$RUNNER_TEMP/d79-diag-venv/bin/pip" install pyimg4 remotezip requests
          echo "$RUNNER_TEMP/d79-diag-venv/bin" >> "$GITHUB_PATH"

      - name: Fetch and verify pristine d79 components
        working-directory: work-27.0b4-d79
        run: |
          python3 ./get_fw.py
          python3 ./verify_d79_port.py

      - name: Supply the device/build wrapping manifest
        working-directory: work-27.0b4-d79
        env:
          D79_IM4M_B64: ${{ secrets.D79_IM4M_B64 }}
        run: |
          test -n "$D79_IM4M_B64"
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          Path("t8030_apticket.der").write_bytes(
              base64.b64decode(os.environ["D79_IM4M_B64"], validate=True)
          )
          PY
          test -s t8030_apticket.der

      - name: Build panic-preserving diagnostic bootchain
        working-directory: work-27.0b4-d79
        env:
          D79_BOOT_VARIANT: diagnostic
        run: python3 ./get_boot.py

      - name: Verify diagnostic artifact
        working-directory: work-27.0b4-d79
        run: |
          for f in iBSS.raw iBEC.img4 RestoreLogo.img4 ANE.img4 AOP.img4 AVE.img4 \
                   SPTM.img4 TXM.img4 GFX.img4 ISP.img4 PMP.img4 \
                   RestoreTrustCache.img4 SIO.img4 WCH.img4 DeviceTree.img4 \
                   SEP.img4 Kernelcache.img4; do
            test -s "Ramdisk/$f"
          done
          test ! -e Ramdisk/RestoreRamdisk.img4

          python3 ./apply_patches.py ibss-normal-diag Ramdisk/iBSS.raw
          ../tools/img4 -i Ramdisk/iBEC.img4 -o verify-diag-ibec.raw
          python3 ./apply_patches.py ibss-normal-diag verify-diag-ibec.raw
          ../tools/img4 -i Ramdisk/TXM.img4 -o verify-diag-txm.raw
          python3 ./apply_patches.py txm-boot verify-diag-txm.raw
          ../tools/img4 -i Ramdisk/Kernelcache.img4 -o verify-diag-kernel.raw
          python3 ./apply_patches.py kc-diag verify-diag-kernel.raw
          ../tools/img4 -i Ramdisk/DeviceTree.img4 -o verify-diag-dt.raw
          python3 - <<'PY'
          from pathlib import Path
          import patch_dt2
          data = Path("verify-diag-dt.raw").read_bytes()
          if not patch_dt2.verify(data):
              raise SystemExit("diagnostic DeviceTree verification failed")
          PY
          rm verify-diag-ibec.raw verify-diag-txm.raw verify-diag-kernel.raw \
             verify-diag-dt.raw

          cp boot_sshrd_linux.py boot_normal_linux.py boot_diag_linux.sh Ramdisk/
          python3 ./write_artifact_info.py --mode normal-diagnostic --directory Ramdisk

      - name: Upload panic-preserving diagnostic bootchain
        uses: actions/upload-artifact@v4
        with:
          name: d79-24A5390f-normal-diagnostic
          path: work-27.0b4-d79/Ramdisk
          if-no-files-found: error
          compression-level: 6
          retention-days: 14

  build-cfw:
    needs: verify-port
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        run: |
          test "$(uname -m)" = arm64
          chmod +x tools/*

      - name: Install build dependencies
        run: |
          brew install rsync
          python3 -m venv "$RUNNER_TEMP/d79-cfw-venv"
          "$RUNNER_TEMP/d79-cfw-venv/bin/pip" install pyimg4 remotezip requests
          echo "$RUNNER_TEMP/d79-cfw-venv/bin" >> "$GITHUB_PATH"

      # Selective extraction is enough: the restore only patches iBEC, DeviceTree, the
      # restore ramdisk, TXM, kernelcache and the raw iBSS. The stock RootFS is never
      # patched and is added back on the machine that runs restore_cfw.sh.
      - name: Fetch d79 restore components (selective)
        working-directory: work-27.0b4-d79
        run: |
          python3 ./get_fw.py
          python3 ./verify_d79_port.py

      # No APTicket / IM4M secret here on purpose: make_cfw.py patches the IPSW components
      # in place as unsigned im4p. idevicerestore signs them at restore time through the
      # local TSS proxy, so the build needs no device manifest.
      - name: Build and verify patched CFW components
        working-directory: work-27.0b4-d79
        env:
          CFW_COMPONENTS_ONLY: "1"
        run: python3 ./make_cfw.py

      - name: Stage patched components (mirrors the CFW/ layout)
        working-directory: work-27.0b4-d79
        run: |
          mkdir -p out/CFW/Firmware/dfu out/CFW/Firmware/all_flash out/Ramdisk
          cp CFW/Firmware/dfu/iBEC.d79.RELEASE.im4p          out/CFW/Firmware/dfu/
          cp CFW/Firmware/all_flash/DeviceTree.d79ap.im4p    out/CFW/Firmware/all_flash/
          cp CFW/Firmware/txm.iphoneos.release.im4p          out/CFW/Firmware/
          cp CFW/094-13753-162.dmg                           out/CFW/
          cp CFW/kernelcache.release.iphone12c               out/CFW/
          cp Ramdisk/iBSS.raw                                out/Ramdisk/
          ( cd out && /usr/bin/find . -type f ! -name SHA256SUMS -exec shasum -a 256 {} + \
              > SHA256SUMS )
          echo "=== staged CFW components ==="
          ( cd out && cat SHA256SUMS )

      - name: Upload patched CFW components
        uses: actions/upload-artifact@v4
        with:
          name: d79-24A5390f-cfw-components
          path: work-27.0b4-d79/out
          if-no-files-found: error
          compression-level: 6
          retention-days: 14
